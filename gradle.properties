# AGP 8 hard-fails the build when a project resolves androidx artifacts
# without this flag, with "This project uses AndroidX dependencies, but the
# 'android.useAndroidX' property is not enabled." The Compose runtime that
# ComposeHelpers.kt compiles against is androidx, so it applies here even
# though the SDK itself exposes no androidx types to consumers.
android.useAndroidX=true

# The default heap is not enough to run the Kotlin and Compose compilers in a
# single --no-daemon CI invocation; the symptom is an OOM or a silently killed
# worker rather than a readable error, so it is set rather than discovered.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
